# CodeQL Advanced (WASB)

# Languages: GitHub Actions workflows + JavaScript/TypeScript extractor.
# build-mode: none — no compile step for either language.
#
# Coverage note (important for security audits):
# - Confirmed targets: .mjs, HtmlService .html, and .github/workflows
# - Google Apps Script .gs is NOT in CodeQL's published JS extractor
#   extension list; a green CodeQL run does NOT prove .gs was analyzed.
# Follow-up: docs/codeql-coverage.md (verify logs; expand or gate .gs
# separately). Do not invent unverified extractor flags for .gs here.
#
# CI success ≠ CodeQL success ≠ GAS (.gs) security review.

name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "45 2 * * 3"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
