name: WASB Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasb-staging-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-staging:
    name: Deploy to staging GAS
    runs-on: ubuntu-latest
    # Static Environment name so Actions can resolve env-scoped secrets/vars.
    environment: staging
    # Bind Environment `staging` secret/var here (not repository-level).
    # Step-scoped re-binding of the same keys often triggers IDE false positives
    # ("Context access might be invalid") when the Actions extension cannot list
    # environment secrets; job-level env keeps access clear and functionally identical.
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASP_JSON_STAGING: ${{ secrets.CLASP_JSON_STAGING }}
      EXPECTED_STAGING_SCRIPT_ID: ${{ vars.EXPECTED_STAGING_SCRIPT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run full CI
        run: npm run ci

      - name: Configure staging clasp
        run: |
          set -euo pipefail
          umask 077
          test -n "${EXPECTED_STAGING_SCRIPT_ID}"
          # Write secrets via Node (not shell printf) and JSON.parse both files
          # before clasp. Errors name CLASPRC_JSON vs CLASP_JSON_STAGING +
          # line/position only — never dump secret bodies.
          node scripts/verify-deploy-target.mjs configure-staging

      - name: Show clasp status
        run: npm run gas:status

      - name: Push staging GAS
        run: npm run gas:push

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$HOME/.clasprc.json"
          rm -f .clasp.json
