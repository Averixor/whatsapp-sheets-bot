name: WASB Deploy Staging

# Policy:
# - Any branch may be selected via workflow_dispatch (feature / PR dry-run OK).
# - Deployed commit SHA is reported in the job log (not main-only).
# - Staging scriptId must match EXPECTED_STAGING_SCRIPT_ID and must NOT equal
#   EXPECTED_PRODUCTION_SCRIPT_ID (both required Environment variables).
# - CLASPRC_JSON / CLASP_JSON_STAGING are step-scoped only (configure step).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasb-staging-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-staging:
    name: Deploy to staging GAS
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Report deployment commit
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "short=$(git rev-parse --short HEAD)"
          echo "subject=$(git log -1 --pretty=%s)"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run full CI
        run: npm run ci

      - name: Configure staging clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON_STAGING: ${{ secrets.CLASP_JSON_STAGING }}
          EXPECTED_STAGING_SCRIPT_ID: ${{ vars.EXPECTED_STAGING_SCRIPT_ID }}
          EXPECTED_PRODUCTION_SCRIPT_ID: ${{ vars.EXPECTED_PRODUCTION_SCRIPT_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${EXPECTED_STAGING_SCRIPT_ID}"
          test -n "${EXPECTED_PRODUCTION_SCRIPT_ID}"
          # Write secrets via Node (not shell printf) and JSON.parse both files
          # before clasp. Rejects staging==production. Never dumps secret bodies.
          node scripts/verify-deploy-target.mjs configure-staging

      - name: Show clasp status
        run: npm run gas:status

      - name: Push staging GAS
        run: npm run gas:push

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$HOME/.clasprc.json"
          rm -f .clasp.json
