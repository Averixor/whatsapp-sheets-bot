# WASB curated instincts (replaces auto-generated 2026-08-29 sample).
# Precedence when this file conflicts with AGENTS.md, .cursor/rules/*,
# contracts/*, docs/module-map.md, current code, or CI: curated repo rules win.
# Treat any remaining generated evidence as non-authoritative.
#
# Each instinct is one YAML document. Action text lives in a literal block
# scalar so editors and parsers do not treat markdown as free-floating YAML.

---
id: wasb-commit-conventional
trigger: "when writing a commit message"
confidence: 1.0
domain: git
source: curated
title: WASB Commit Convention
action: |
  Use Conventional Commit-style subjects.

  Choose the prefix according to the change, for example:

  - fix: — runtime or behavior correction
  - chore: — tooling, CI, repository maintenance
  - docs: — documentation-only change
  - refactor: — structural change without intended behavior change
  - test: — test or verification-only change
  - feat: — new user-visible or runtime capability

  Keep one logical task per commit.

  Do not force every commit to use fix:.
---
id: wasb-file-naming
trigger: "when creating a new file"
confidence: 1.0
domain: code-style
source: curated
title: WASB File Naming
action: |
  Follow the convention of the target subsystem instead of applying one
  repository-wide filename style.

  - GAS runtime .gs: usually PascalCase or dotted PascalCase,
    e.g. PersonnelRepository.gs, AccessControl.Core.gs
  - Node tooling .mjs: kebab-case,
    e.g. verify-monthly-callsign-sync.mjs, ops-gas.mjs
  - Client HTML modules: existing Js.*.html, Styles*.html conventions
  - Contracts: kebab-case .contract.json

  Prefer the naming pattern already used by neighboring files.
---
id: wasb-node-imports
trigger: "when importing modules in Node tooling"
confidence: 1.0
domain: code-style
source: curated
title: WASB Node Imports
action: |
  For repository-owned Node .mjs modules, use relative ESM imports.

  Example:

    import { loadContract } from "./lib/load-contract.mjs";

  Use node: specifiers for Node built-ins.

  Do not apply this rule to Google Apps Script .gs files: GAS runtime files
  share the Apps Script global namespace and do not use ESM imports.
---
id: wasb-node-export-style
trigger: "when exporting from a Node module"
confidence: 1.0
domain: code-style
source: curated
title: WASB Node Export Style
action: |
  Prefer named exports in reusable Node .mjs helpers.

  Do not translate this rule to GAS .gs runtime files or browser HTML modules.

  - GAS exposes global functions/objects through the Apps Script runtime.
  - Client modules may expose approved bindings through window.*.
---
id: wasb-test-verification-layout
trigger: "when writing tests or verification checks"
confidence: 1.0
domain: testing
source: curated
title: WASB Test and Verification Layout
action: |
  Place verification according to its execution environment.

  - GAS runtime/domain tests: tests/*.gs
  - Production/runtime smoke tests: smoke/*.gs
  - Local static, contract and regression checks: scripts/verify-*.mjs,
    scripts/audit-*.mjs or the established neighboring pattern
  - Contracts and expected invariants: contracts/*.json

  Do not create __tests__/ or mirror the runtime source tree unless a
  separate project decision establishes that convention.

  After changes, run the relevant focused check and then npm run ci.
